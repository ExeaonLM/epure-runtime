[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epure-runtime"
version = "0.1.0"
description = "Run compressed models. Small footprint, same answers."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Akpalu Elliot Elikplim", email = "elliotakpalu@gmail.com" }]
keywords = ["inference", "llm", "runtime", "edge", "cpu"]

dependencies = [
    "numpy>=1.24",
    "huggingface-hub>=0.23",
    "torch>=2.1",
    "transformers>=4.40",
    "constriction>=0.3",
    "accelerate>=0.30",
]

[project.optional-dependencies]
eval = ["lm-eval>=0.4", "datasets>=2.18"]
audio = ["soundfile>=0.12", "librosa>=0.10"]

[project.urls]
Homepage = "https://github.com/ExeaonLM/epure-runtime"
Models = "https://huggingface.co/Exeaon"

[project.scripts]
epure = "epure.cli:main"

[tool.setuptools.packages.find]
include = ["epure*"]
