name: release

# Wheels carry the compiled Rust kernel, so `pip install epure-runtime` gets the
# fast path with no toolchain on the user's machine. Building them here is what
# makes that true — a source-only release would silently hand everyone the slow
# pure-PyTorch fallback.
#
# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored in this
# repository or anywhere else.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target_index:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  wheels:
    name: wheel:${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,  target: x86_64,  manylinux: auto }
          - { name: linux-aarch64,  os: ubuntu-latest,  target: aarch64, manylinux: auto }
          # Cross-compiled from the ARM runner: GitHub retired the macos-13
          # x86_64 images, so a job asking for one queues forever rather
          # than failing. rustup adds the target; the build is native-speed
          # anyway since it is a cross-compile, not emulation.
          - { name: macos-x86_64,   os: macos-14,       target: x86_64,  manylinux: "" }
          - { name: macos-arm64,    os: macos-14,       target: aarch64, manylinux: "" }
          - { name: windows-x64,    os: windows-latest, target: x64,     manylinux: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # abi3 means one wheel serves every Python from 3.9 up.
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  smoke:
    # Install the built wheel exactly as a user would and confirm the compiled
    # kernel is actually inside it. A wheel that imports but silently falls back
    # to Python is the failure this catches, and it is invisible otherwise.
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Install and verify
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl
          python - <<'PY'
          import epure
          from epure.kernels import cpu
          print("version:", epure.__version__)
          assert cpu.available(), "compiled Rust kernel MISSING from the wheel"
          print("rust kernel: OK,", cpu.threads(), "threads")
          PY
          epure --version

  publish:
    needs: [wheels, sdist, smoke]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_index || 'pypi' }}
    permissions:
      id-token: write        # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist

      - name: Publish to TestPyPI
        if: inputs.target_index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: inputs.target_index != 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
